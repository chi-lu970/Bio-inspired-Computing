<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyVRP — 路線規劃視覺化</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">

  <!-- ════════════════ Header ════════════════ -->
  <header>
    <button class="logo" id="btn-home" title="回到首頁（清除所有資料）">Py<span>VRP</span> Web</button>
    <div class="example-picker">
      <button class="header-btn" id="btn-load-example">📂 載入範例 ▾</button>
      <div class="example-dropdown" id="example-dropdown">
        <div class="example-option" data-file="taipei_demo.json">7-11 台北市日班配送 (16 家門市)</div>
        <div class="example-option" data-file="taipei_711_night.json">7-11 台北市大夜班配送 (20 家門市)</div>
      </div>
    </div>
    <div class="spacer"></div>
    <a href="/docs" target="_blank" class="header-btn">API 文件</a>
  </header>

  <!-- ════════════════ Main Grid ════════════════ -->
  <main>

    <!-- ── 左側輸入面板 ── -->
    <div id="panel-left">
      <div class="panel-scroll">

        <!-- 倉庫 -->
        <div class="section-card">
          <div class="card-header"><span class="icon">🏠</span> 倉庫<button class="collapse-btn" title="縮合">▾</button></div>
          <div class="card-body" id="depot-body">
            <div class="field">
              <label>倉庫名稱</label>
              <input type="text" id="depot-name" value="倉庫" />
            </div>
            <div class="row-2">
              <div class="field">
                <label>緯度</label>
                <input type="number" id="depot-lat" step="0.0001" placeholder="25.0478"
                       min="-90" max="90" />
                <span class="err-msg">緯度需介於 -90 ~ 90</span>
              </div>
              <div class="field">
                <label>經度</label>
                <input type="number" id="depot-lng" step="0.0001" placeholder="121.5170"
                       min="-180" max="180" />
                <span class="err-msg">經度需介於 -180 ~ 180</span>
              </div>
            </div>
            <div class="row-2">
              <div class="field">
                <label>開放時間</label>
                <input type="time" id="depot-tw-start" value="08:00" />
              </div>
              <div class="field">
                <label>結束時間</label>
                <input type="time" id="depot-tw-end" value="20:00" />
                <span class="err-msg">結束需晚於開始</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 店面 -->
        <div class="section-card">
          <div class="card-header">
            <span class="icon">📦</span>
            店面
            <span class="badge" id="store-count">0</span>
            <button class="collapse-btn" title="縮合">▾</button>
          </div>
          <div class="card-body">
            <div id="store-list"></div>
            <button class="add-btn" id="btn-add-store">＋ 新增店面</button>
          </div>
        </div>

        <!-- 車隊 -->
        <div class="section-card">
          <div class="card-header">
            <span class="icon">🚛</span>
            車隊設定
            <span class="badge" id="vt-count">0</span>
            <button class="collapse-btn" title="縮合">▾</button>
          </div>
          <div class="card-body">
            <div id="vt-list"></div>
            <button class="add-btn" id="btn-add-vt">＋ 新增車型</button>
          </div>
        </div>

        <!-- 求解設定（收合式） -->
        <div class="section-card">
          <div class="card-header"><span class="icon">⚙️</span> 求解設定<button class="collapse-btn" title="縮合">▾</button></div>
          <div class="card-body">
            <div class="row-2">
              <div class="field">
                <label>最長求解秒數</label>
                <input type="number" id="cfg-runtime" value="10" min="1" max="300" />
              </div>
              <div class="field">
                <label>平均車速 (km/h)</label>
                <input type="number" id="cfg-speed" value="40" min="1" max="200" />
              </div>
            </div>
            <div class="field">
              <label>隨機種子</label>
              <input type="number" id="cfg-seed" value="42" />
            </div>
          </div>
        </div>

      </div><!-- /panel-scroll -->

      <div class="panel-actions">
        <button id="btn-solve" disabled>開始計算</button>
      </div>
    </div><!-- /panel-left -->

    <!-- ── 中央地圖 ── -->
    <div id="map-wrap">
      <div id="map"></div>
      <div id="map-loading">
        <div class="spinner"></div>
        <span>求解中，請稍候…</span>
      </div>
      <div id="toast"></div>
    </div>

    <!-- ── 右側結果面板 ── -->
    <div id="panel-right">
      <div class="panel-title">📋 路線詳細資訊</div>
      <div id="results-scroll">
        <div class="empty-state" id="results-empty">
          <div class="empty-icon">🗺️</div>
          <p>填寫左側表單並點擊<br>「開始計算」，<br>路線規劃結果將顯示於此。</p>
        </div>
      </div>
    </div>

  </main>

  <!-- ════════════════ Footer ════════════════ -->
  <footer>
    <div class="stat">
      <span class="stat-label">狀態：</span>
      <span class="stat-val idle" id="ft-status">待機</span>
    </div>
    <div class="stat">
      <span class="stat-label">總距離：</span>
      <span class="stat-val" id="ft-dist">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">使用車輛：</span>
      <span class="stat-val" id="ft-vehicles">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">求解耗時：</span>
      <span class="stat-val" id="ft-time">—</span>
    </div>
  </footer>

</div><!-- /app -->

<!-- JS（模組化，順序：api → map → form） -->
<script type="module" src="/js/api.js"></script>
<script type="module" src="/js/map.js"></script>
<script type="module" src="/js/form.js"></script>
</body>
</html>
